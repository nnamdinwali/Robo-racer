plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.roboracer.game'

    defaultConfig {
        applicationId "com.roboracer.game"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/*.kotlin_module'
        pickFirst 'META-INF/AL2.0'
        pickFirst 'META-INF/LGPL2.1'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'

    // ── Appodeal SDK (latest: 3.12.0.1) ──────────────────────────────────────
    // AdMob and Meta (Facebook) Audience Network are EXCLUDED on purpose:
    // both require extra app-level setup — AdMob needs its own Google UMP/CMP
    // consent flow for UK/EU users and an app-id in the manifest, Meta needs a
    // separate Audience Network app/placement setup. Excluding them keeps the
    // build simple; all other Appodeal networks still mediate normally.
    implementation('com.appodeal.ads:sdk:3.12.0.1') {
        exclude group: 'com.appodeal.ads.sdk.networks', module: 'admob'
        exclude group: 'com.appodeal.ads.sdk.networks', module: 'meta'
        // Meta analytics ships with the Meta network setup — not needed either
        exclude group: 'com.appodeal.ads.sdk.services', module: 'facebook_analytics'
    }
}
