plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'com.roboracer.game'

    defaultConfig {
        applicationId "com.roboracer.game"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.3"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/*.kotlin_module'
        pickFirst 'META-INF/AL2.0'
        pickFirst 'META-INF/LGPL2.1'
    }
}

// HARD BLOCK AdMob only — Meta / Yandex / everything else is allowed.
configurations.configureEach {
    exclude group: 'com.appodeal.ads.sdk.networks', module: 'admob'
    exclude group: 'com.appodeal.ads.sdk.networks', module: 'google_ad_manager'
    exclude group: 'com.appodeal.ads.sdk.adapters', module: 'admob'
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    exclude group: 'com.google.android.ump', module: 'user-messaging-platform'
    exclude group: 'io.appmetrica.analytics', module: 'analytics-ad-revenue-admob-v23'
    exclude group: 'com.unity3d.ads-mediation', module: 'admob-adapter'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'

    // Appodeal SDK 4.4.0 (latest) — all networks except AdMob
    implementation 'com.appodeal.ads.sdk:core:4.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:amazon:12.0.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:applovin:13.6.3.0'
    implementation 'com.appodeal.ads.sdk.adapters:applovin_max:13.6.3.1'
    implementation 'com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0'
    implementation 'com.appodeal.ads.sdk.adapters:bidon:0.14.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:bigo_ads:5.9.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:chartboost:9.10.2.0'
    implementation 'com.appodeal.ads.sdk.adapters:dt_exchange:8.4.6.0'
    implementation 'com.appodeal.ads.sdk.adapters:inmobi:11.3.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:ironsource:9.4.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:level_play:9.4.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:meta:6.21.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:mintegral:17.1.61.0'
    implementation 'com.appodeal.ads.sdk.adapters:mobilefuse:1.11.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:moloco:4.3.1.0'
    implementation 'com.appodeal.ads.sdk.adapters:my_target:5.47.1.0'
    implementation 'com.appodeal.ads.sdk.adapters:ogury:6.2.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:pubmatic:4.10.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:smaato:22.7.2.0'
    implementation 'com.appodeal.ads.sdk.adapters:startio:5.2.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:taurusx:1.12.2.0'
    implementation 'com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:verve:3.7.1.0'
    implementation 'com.appodeal.ads.sdk.adapters:vungle:7.7.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:yandex:7.17.0.0'
}

// Fail the build if any AdMob artifact sneaks in (same protective layer as before)
def forbiddenAdMobCoordinates = [
    'com.appodeal.ads.sdk.networks:admob',
    'com.appodeal.ads.sdk.networks:google_ad_manager',
    'com.appodeal.ads.sdk.adapters:admob',
    'com.google.android.gms:play-services-ads',
    'com.google.android.gms:play-services-ads-lite',
    'com.google.android.ump:user-messaging-platform',
    'io.appmetrica.analytics:analytics-ad-revenue-admob-v23',
    'com.unity3d.ads-mediation:admob-adapter',
].asImmutable()

def forbiddenAdMobFileNames = [
    'admob',
    'google_ad_manager',
    'play-services-ads-lite',
    'user-messaging-platform',
].asImmutable()

def verifyNoAdMob = tasks.register('verifyNoAdMob') {
    group = 'verification'
    description = 'Fails if any AdMob artifact is present on a runtime classpath.'

    doLast {
        def violations = []
        configurations.matching { configuration ->
            configuration.name.toLowerCase().endsWith('runtimeclasspath') && configuration.canBeResolved
        }.each { configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def module = artifact.moduleVersion.id
                def coordinate = "${module.group}:${artifact.name}:${module.version}".toLowerCase()
                def fileName = artifact.file.name.toLowerCase()

                if (forbiddenAdMobCoordinates.any { coordinate.startsWith("${it}:") } ||
                        forbiddenAdMobFileNames.any { fileName.contains(it) && !fileName.contains('meta') }) {
                    violations << "${configuration.name}: ${coordinate} (${artifact.file.name})"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Forbidden AdMob artifacts detected in Robo Racer:\n - " +
                            violations.unique().join("\n - ")
            )
        }

        logger.lifecycle('verifyNoAdMob passed: no AdMob artifacts found.')
    }
}

tasks.matching { task -> task.name == 'preBuild' }.configureEach {
    dependsOn(verifyNoAdMob)
}
